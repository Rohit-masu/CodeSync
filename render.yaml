services:
  # Server Service
  - type: web
    name: code-sync-server
    runtime: node
    plan: free
    repo: https://github.com/Rohit-masu/CodeSync.git
    rootDir: server
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGO_URI
        value: ${MONGODB_URI}
      - key: JWT_SECRET
        value: ${JWT_SECRET}
      - key: GROQ_API_KEY
        value: ${GROQ_API_KEY}
      - key: HUGGING_FACE_API_KEY
        value: ${HUGGING_FACE_API_KEY}
      - key: PISTON_URL
        value: https://emkc.org/api/v2/piston
      - key: JUDGE0_URL
        value: https://api.judge0.com/cebin/v1

  # Client Service (Static)
  - type: web
    name: code-sync-client
    runtime: static
    plan: free
    repo: https://github.com/Rohit-masu/CodeSync.git
    rootDir: client/dist
    buildCommand: cd client && npm run build
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
